<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Layout</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9f0f5;
      font-family: Arial, sans-serif;
    }

    .frame {
      position: relative;
      width: 280px;
      height: 140px;
      background-color: lightgray;
      display: flex;
      border: 1px solid #999;
      box-sizing: border-box;
    }

    .box {
      position: absolute;
      width: 70px;
      height: 40px;
      background-color: #ffffff;
      border: 1px solid #666;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-sizing: border-box;
    }

    .p1 {
      left: 10px;
      bottom: 10px;
    }

    .p2 {
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
    }

    .p3 {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="box p1">1</div>
    <div class="box p2">2</div>
    <div class="box p3">3</div>
  </div>
</body>
</html>
