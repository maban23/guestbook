<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쉬운 레이아웃</title>
    <style>
        /* 1. 화면 전체를 쓰기 위해 기본 여백을 없애고 높이를 꽉 채움 */
        body {
            margin: 0;
            height: 100vh;
        }

        /* 2. 전체를 세로(column)로 정렬하는 상자 */
        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 3. 박스 공통 디자인 (테두리 + 글자 가운데 정렬) */
        .box {
            border: 1px solid #ddd;
            display: flex;
            justify-content: center; /* 가로 가운데 */
            align-items: center;     /* 세로 가운데 */
        }

        /* 4. header와 footer (내용물 크기만큼만 차지) */
        .header, .footer {
            background-color: #7085ff;
            padding: 20px;
        }

        /* 5. main (남은 공간을 모두 차지) */
        .main {
            background-color: #8aff8a;
            flex: 1; 
        }
    </style>
</head>
<body>

    <div class="screen">
        <div class="box header">header</div>
        <div class="box main">main</div>
        <div class="box footer">footer</div>
    </div>

</body>
</html>
